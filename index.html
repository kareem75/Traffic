<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Traffic Light Simulator</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="message" id="welcome-message">Welcome!</div>

    <div class="traffic-light">
      <div class="timer" id="countdown">3</div>
      <div class="light red" id="red"></div>
      <div class="light yellow" id="yellow"></div>
      <div class="light green" id="green"></div>
    </div>

    <div class="controls">
      <button id="start-btn">Start</button>
      <button id="stop-btn">Stop</button>
    </div>

    <script src="main.js"></script>
  </body>
</html>
